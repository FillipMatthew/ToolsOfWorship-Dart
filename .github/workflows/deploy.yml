name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build web app
        run: flutter build web --base-href "/app/"

      - name: Pre-deploy Cleanup
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Delete the specific folders and binary to ensure a clean slate
            # We use -f to ignore errors if the files don't exist yet
            rm -rf ${{ secrets.TARGET_DIR }}
            # Re-create the directory structure so SCP doesn't fail
            mkdir -p ${{ secrets.TARGET_DIR }}

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/web/*"
          target: ${{ secrets.TARGET_DIR }}
          strip_file_prefix: true

      - name: Set Permissions
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            chmod -R 755 ${{ secrets.TARGET_DIR }}
